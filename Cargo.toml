[workspace]
resolver = "3"
members = ["crates/shared", "crates/server", "crates/web"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
automerge = "0.12"
autosurgeon = "0.14"
axum = { version = "0.8", features = ["ws"] }
fractional_index = "2"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
prost = "0.14"
prost-build = "0.14"
protox = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal"] }
tokio-tungstenite = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
