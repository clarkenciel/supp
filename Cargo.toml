[workspace]
resolver = "3"
members = ["crates/shared", "crates/server", "crates/web"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
automerge = "0.12"
autosurgeon = "0.14"
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", features = ["cookie", "cookie-private"] }
fractional_index = "2"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
openidconnect = "4"
getrandom = "0.4"
prost = "0.14"
prost-build = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
protox = "0.10"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal"] }
tokio-tungstenite = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true
codegen-units = 1

# Download size matters more than speed for the browser bundle.
[profile.release.package.supp-web]
opt-level = "z"
